# Local stack: PostgreSQL + API. Settings come from the environment / .env (see .env.example).
# The fallback password below is for local development only; set POSTGRES_PASSWORD in .env elsewhere.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-citizen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citizen_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-citizen_news}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
      target: api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-citizen}:${POSTGRES_PASSWORD:-citizen_dev_only}@db:5432/${POSTGRES_DB:-citizen_news}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      # Défaut de développement ; l'API refuse de démarrer avec lui si COOKIE_SECURE=true.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-make-media-great-again}
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-8}
      RATE_LIMIT_ADMIN_LOGIN_PER_IP: ${RATE_LIMIT_ADMIN_LOGIN_PER_IP:-10}
      RATE_LIMIT_ADMIN_LOGIN_WINDOW_SECONDS: ${RATE_LIMIT_ADMIN_LOGIN_WINDOW_SECONDS:-900}
      LOGIN_TOKEN_TTL_MINUTES: ${LOGIN_TOKEN_TTL_MINUTES:-15}
      # true par défaut : l'API est servie derrière le nginx du service web (X-Forwarded-For), sinon toutes
      # les limites par IP verraient l'adresse de nginx.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # "console" logs the login link (dev only); "smtp" sends it (see SMTP_* and the mailpit service).
      MAIL_BACKEND: ${MAIL_BACKEND:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-Citizen News <no-reply@localhost>}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-3600}
      RATE_LIMIT_MAGIC_LINK_PER_EMAIL: ${RATE_LIMIT_MAGIC_LINK_PER_EMAIL:-5}
      RATE_LIMIT_MAGIC_LINK_PER_IP: ${RATE_LIMIT_MAGIC_LINK_PER_IP:-20}
      RATE_LIMIT_VERIFY_PER_IP: ${RATE_LIMIT_VERIFY_PER_IP:-30}
      EDITION_HOUR: ${EDITION_HOUR:-17}
      EDITION_TIMEZONE: ${EDITION_TIMEZONE:-Europe/Paris}
      POOL_WINDOW_HOURS: ${POOL_WINDOW_HOURS:-24}
      RADAR_MAX_SOURCES: ${RADAR_MAX_SOURCES:-3}
      RATE_LIMIT_UNE_WRITES_PER_ACCOUNT: ${RATE_LIMIT_UNE_WRITES_PER_ACCOUNT:-60}
      RATE_LIMIT_UNE_WINDOW_SECONDS: ${RATE_LIMIT_UNE_WINDOW_SECONDS:-60}
      DEMO_SEED: ${DEMO_SEED:-false}
    ports:
      # Local seulement par défaut : avec TRUST_PROXY=true, un hôte qui joindrait ce port pourrait forger
      # X-Forwarded-For et contourner les limites par IP. Le navigateur passe par le service web (8080).
      - "${API_BIND:-127.0.0.1}:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Front (React, build statique servi par nginx, qui proxifie /api vers api:8000). web/ vient de la pile front :
  # tant qu'elle n'est pas mergée, `docker compose up` échoue sur ce service (« web: path not found »).
  web:
    build:
      context: ./web
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  # Worker : ingestion + regroupement toutes les INGEST_INTERVAL_MINUTES, ET clôture de l'édition (vérifiée chaque
  # minute : c'est lui qui publie la une collective à EDITION_HOUR). Il doit voir les MÊMES réglages d'édition et de
  # bassin que l'API : le bassin au moment de la clôture est celui que les citoyens ont vu.
  # Démarre une fois l'API saine, c'est-à-dire une fois les migrations appliquées.
  worker:
    build:
      context: ./api
      target: api
    command: ["python", "-m", "app.cli", "run", "--interval-minutes", "${INGEST_INTERVAL_MINUTES:-15}"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-citizen}:${POSTGRES_PASSWORD:-citizen_dev_only}@db:5432/${POSTGRES_DB:-citizen_news}
      EDITION_HOUR: ${EDITION_HOUR:-17}
      EDITION_TIMEZONE: ${EDITION_TIMEZONE:-Europe/Paris}
      POOL_WINDOW_HOURS: ${POOL_WINDOW_HOURS:-24}
      RADAR_MAX_SOURCES: ${RADAR_MAX_SOURCES:-3}
    depends_on:
      api:
        condition: service_healthy

  # Tests de l'API (profil `test`, jamais lancé par `docker compose up`) : `scripts/test-api.sh` ou
  # `docker compose --profile test run --rm api-test [pytest ...]`. Voir api/README.md.
  # PostgreSQL à empreinte minimale : données en tmpfs, aucune durabilité (fsync off), peu de mémoire partagée.
  db-test:
    image: postgres:16
    profiles: ["test"]
    environment:
      POSTGRES_USER: citizen
      POSTGRES_PASSWORD: citizen_test_only
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - shared_buffers=16MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=8MB
      - -c
      - wal_buffers=1MB
      - -c
      - min_wal_size=32MB
      - -c
      - max_wal_size=64MB
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - autovacuum=off
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citizen -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Cible `test` du Dockerfile ; le code est monté en lecture seule : modifier le code ne demande aucun rebuild.
  api-test:
    build:
      context: ./api
      target: test
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql+psycopg://citizen:citizen_test_only@db-test:5432/postgres
    volumes:
      - ./api:/srv/api:ro
    depends_on:
      db-test:
        condition: service_healthy

  # Optional local mail catcher: `docker compose --profile mail up`, then MAIL_BACKEND=smtp SMTP_HOST=mailpit
  # SMTP_PORT=1025 SMTP_STARTTLS=false in .env. Web UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21
    profiles: ["mail"]
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  pgdata:
