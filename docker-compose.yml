# Local stack: PostgreSQL + API. Settings come from the environment / .env (see .env.example).
# The fallback password below is for local development only; set POSTGRES_PASSWORD in .env elsewhere.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-citizen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citizen_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-citizen_news}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-citizen}:${POSTGRES_PASSWORD:-citizen_dev_only}@db:5432/${POSTGRES_DB:-citizen_news}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Periodic ingestion + clustering. Starts once the API is healthy, i.e. once migrations are applied.
  worker:
    build: ./api
    command: ["python", "-m", "app.cli", "run", "--interval-minutes", "${INGEST_INTERVAL_MINUTES:-15}"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-citizen}:${POSTGRES_PASSWORD:-citizen_dev_only}@db:5432/${POSTGRES_DB:-citizen_news}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
