# Citizen front page: support levels, reasons and ranking. "score" is the smoothed (Wilson lower bound)
# share of "more" among the opinions of a topic, between 0 and 1 (see docs/halving.md).
support:
  medium_min_votes: 10     # votes (all choices) needed for the "medium" level
  medium_score: 0.30       # and a score of at least this
  high_min_votes: 30
  high_score: 0.50

reasons:                   # evaluated in this order: the first one that matches is the card's reason
  common_priority:         # "Priorité commune": strong AND broad support
    min_votes: 50
    min_score: 0.50
  under_the_radar:         # "Sous les radars": few media, high support
    max_sources: 2         # at most this many distinct media
    min_votes: 15
    min_score: 0.50
  strong_mobilisation:     # "Forte mobilisation": many "more" (and at least medium support)
    min_more_votes: 30
  emerging:                # "Sujet émergent": votes surging, or recently emerged (and at least medium support)
    trend_hours: 6         # window of "recent" votes
    trend_min_votes: 10    # at least this many votes in that window...
    trend_share: 0.5       # ...making up at least this share of all the topic's votes
    emerged_recent_hours: 48   # a topic that reached state `emerged` less than this long ago

ranking:
  support_weight: 0.6      # rank = support_weight * score + freshness_weight * freshness
  freshness_weight: 0.4
  freshness_half_life_hours: 24   # freshness = 0.5 ** (age of the latest article / half-life)
  min_votes: 10            # a topic needs this many votes to be on the front page...
  recent_hours: 12         # ...or its latest article must be at most this old
