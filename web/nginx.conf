# Le jeton du lien magique est dans la query string (/connexion?token=…) : on journalise $uri
# (chemin sans query string) et non $request_uri pour qu'il ne finisse pas dans access.log.
log_format sans_query '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
  listen 80;
  access_log /var/log/nginx/access.log sans_query;
  add_header Referrer-Policy "no-referrer" always;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Résolution à la requête (DNS de Docker) : nginx démarre même si l'API n'est pas encore up.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fichiers hachés : cache long
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Referrer-Policy "no-referrer" always; # add_header d'un location : pas d'héritage du server
    try_files $uri =404;
  }

  # SPA : toute autre route retombe sur index.html (jamais mis en cache)
  location / {
    add_header Cache-Control "no-cache";
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri /index.html;
  }
}
